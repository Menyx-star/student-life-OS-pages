<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset your password</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#12142A; color:#F5F1E8; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; }
  .card { background:#1B1E3D; border:1px solid #31356A; border-radius:16px; padding:28px; max-width:360px; width:100%; }
  h2 { margin-top:0; }
  input { width:100%; box-sizing:border-box; background:#242850; border:1px solid #31356A; border-radius:10px; color:#F5F1E8; padding:12px; margin-bottom:12px; font-size:15px; }
  button { width:100%; background:#F2A93B; color:#12142A; border:none; border-radius:10px; padding:13px; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:0.6; }
  p.msg { font-size:14px; }
  p.error { color:#F0837F; }
  p.success { color:#7FD9B9; }
</style>
</head>
<body>
  <div class="card">
    <h2>Set a new password</h2>
    <div id="form">
      <input id="password" type="password" placeholder="New password (min 6 characters)" />
      <input id="confirm" type="password" placeholder="Confirm new password" />
      <button id="submit">Update password</button>
      <p class="msg" id="msg"></p>
    </div>
  </div>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.0";
    const supabase = createClient("https://idzntjlenfcygalpwygh.supabase.co", "sb_publishable_ESwfjTGe-IfDqCt9aHBPCQ_dLXpeUR4");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit");
    // The recovery token arrives in the URL fragment (#access_token=...),
    // which never reaches the server at all - has to be parsed client-side.
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = hashParams.get("access_token");
    const refreshToken = hashParams.get("refresh_token");
    const type = hashParams.get("type");
    if (!accessToken || type !== "recovery") {
      msg.textContent = "This link is invalid or has expired. Request a new one from the app.";
      msg.className = "msg error";
      submitBtn.disabled = true;
    } else {
      supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    }
    submitBtn.addEventListener("click", async () => {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password.length < 6) {
        msg.textContent = "Password must be at least 6 characters.";
        msg.className = "msg error";
        return;
      }
      if (password !== confirm) {
        msg.textContent = "Passwords don't match.";
        msg.className = "msg error";
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";
      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        msg.textContent = error.message;
        msg.className = "msg error";
        submitBtn.disabled = false;
        submitBtn.textContent = "Update password";
      } else {
        document.getElementById("form").innerHTML = '<p class="msg success">Password updated! You can close this tab and sign in with your new password in the app.</p>';
      }
    });
  </script>
</body>
</html>
